<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>Detay Elektronik · Ahmet Mete Öner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161616; --panel:#1f1f1f; --line:#2c2c2c;
  --text:#ffffff; --muted:#9a9a9a; --blue:#0092cb; --blue-dk:#007aab;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:300;
  min-height:100%;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:440px;padding:28px 22px 40px}
.logo{display:block;width:78%;max-width:320px;height:auto;margin:8px auto 0}
.who{text-align:center;margin:18px 0 34px}
.who h1{font-weight:400;font-size:1.45rem;letter-spacing:.02em;margin:0}
.who p{margin:4px 0 0;color:var(--muted);font-size:.98rem}
.bar{width:44px;height:4px;background:var(--blue);margin:14px auto 0}

.item{border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:16px;
  padding:20px 4px;cursor:pointer;font-size:1.2rem;font-weight:400}
.head:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ico{width:46px;height:46px;flex:none;border:1.5px solid var(--blue);border-radius:50%;
  display:grid;place-items:center;color:var(--blue);transition:background .2s,color .2s}
.ico svg{width:22px;height:22px}
.head .label{flex:1}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .25s}
.item.open .ico{background:var(--blue);color:#fff}
.item.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.item.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:0 4px 22px 66px}

.big{font-size:1.5rem;font-weight:400;letter-spacing:.04em;margin:0 0 14px}
.btns{display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  font:inherit;font-weight:500;font-size:1rem;padding:13px 10px;border-radius:12px;cursor:pointer;
  border:1.5px solid var(--blue);background:transparent;color:var(--text)}
.btn.fill{background:var(--blue);color:#fff}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn svg{width:18px;height:18px}

.small{color:var(--muted);font-size:.9rem;margin:0}
.name{font-size:1.15rem;font-weight:400;margin:2px 0 12px}
.iban{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;
  background:var(--panel);border:1px dashed #3a3a3a;border-radius:12px;padding:14px;
  font-size:1.05rem;font-weight:400;letter-spacing:.06em;line-height:1.5;word-break:break-word}
.iban:focus-visible{outline:2px solid var(--blue)}
.iban.done{border-color:var(--blue);border-style:solid}
.hint{display:block;margin-top:8px;font-size:.88rem;color:var(--blue);min-height:1.2em}

.foot{text-align:center;margin-top:34px;font-size:.9rem}
.foot a{color:var(--muted);text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--blue);color:#fff;padding:11px 20px;border-radius:30px;font-weight:500;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.inner{padding-left:4px}}
</style>
</head>

  a.select(); a.setSelectionRange(0,99); try{document.execCommand('copy');done()}catch(e){hint.textContent='Kopyalanamadı, IBAN\'ı basılı tutup kopyalayın'}
  document.body.removeChild(a);
}
ib.addEventListener('click',function(){
  var txt=ib.dataset.copy;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){fallback(txt)})}
  else fallback(txt);
});
</script>
